[workspace]
changelog_update = true
# The bot's own release request has a release-plz-* head branch, which is
# exactly what the branch heuristic behind this default recognizes: the
# release half fires only on the push that lands that request's bump, so an
# ordinary work merge publishes nothing and the release decision stays on the
# one merge button.
release_always = false
publish = true
# cargo-dist owns the GitHub release, because it is the half that has the
# installers to attach. release-plz creating it first leaves dist's host job
# failing on "a release with the same tag name already exists" and every
# release carrying no binaries. The tag stays release-plz's; git_tag_enable is
# separate and still on.
git_release_enable = false
# False: the `claude_session` lib target exists so this crate's own integration
# tests can link it, and no external consumer holds that API. The shipped
# surface is the binary. Set true if the library ever gains outside consumers.
semver_check = false

[changelog]
# The default body template writes the scope as `*(scope)*` and the breaking
# marker as `[**breaking**]`. AGENTS.md forbids decorative emphasis, and the
# `every_markdown_file_is_free_of_decorative_emphasis` contract scans every
# Markdown file in the tree, so a generated changelog carrying either fails the
# gate on the release request and no release can merge.
#
# These edit the rendered text rather than replacing `body`. A copy of
# release-plz's own template would silently drift from it at every upgrade,
# where two rules that match nothing are visible in the request's diff.
postprocessors = [
  { pattern = '\*\(([^)]*)\)\*', replace = "(${1})" },
  { pattern = '\[\*\*breaking\*\*\]', replace = "[breaking]" },
]
