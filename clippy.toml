  { path = "std::println", reason = "ADR-0074: terminal bytes belong to the output writer" },
  { path = "std::eprint", reason = "ADR-0074: terminal bytes belong to the output writer" },
  { path = "std::eprintln", reason = "ADR-0074: terminal bytes belong to the output writer" },
