# The host supplies the hook runner prek (host-requirements.toml). This is the
# oldest prek that runs this file: https://prek.j178.dev/reference/configuration/#minimum_prek_version
minimum_prek_version: "0.5.7"
default_install_hook_types: [pre-commit, commit-msg, pre-push, pre-merge-commit]

repos:
# BEGIN release-kit
# The release convention's hooks. Install every stage they run at with
# the hook manager this project uses, for example:
# prek install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push --hook-type pre-merge-commit
# A CI sweep commits nothing, so a job running the project's hook manager
# against a trunk checkout sets SKIP=no-commit-to-branch,rk-worktree-location in its environment.
# Append the id of every check this project classifies local-only: the
# value is a list the project owns the tail of.
# rk integrate runs this clone's pre-merge-commit hook through git, on the
# change the integration squashes, and refuses where none is installed.
# Tag pre-merge-commit on every check that must pass before work reaches
# the trunk, and add it to default_stages where this file sets them. Have
# continuous integration invoke the same checks: a check that runs on one
# side of the boundary alone guards one side alone. prek runs each nested
# .pre-commit-config.yaml as a project of its own, so a project that runs
# prek lists a directory of fixtures in a root .prekignore.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --force-scope]
  - repo: local
    hooks:
      - id: rk-message
        name: rk message content
        stages: [commit-msg]
        language: system
        entry: rk message --check
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, master]
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: rk-branch-name
        name: rk branch name
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'branch=$(git symbolic-ref --quiet --short HEAD) || exit 0; [ "$branch" = master ] && exit 0; printf %s "$branch" | grep -Eq "^((build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)/[A-Za-z0-9._/-]+|([0-9]+|[A-Z][A-Z0-9]+-[0-9]+)-[A-Za-z0-9._-]+|release[-/].+|rk-release/.+)$" && exit 0; echo "branch $branch is neither <type>/<slug> nor <issue-id>-<slug>; gh issue develop <issue> --checkout or its glab counterpart mints the linked form" >&2; exit 1'
      - id: rk-worktree-location
        name: rk worktree location
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$(git rev-parse --git-dir)" = "$(git rev-parse --git-common-dir)" ] || exit 0; branch=$(git symbolic-ref --quiet --short HEAD) || { echo "this project works in worktrees — the main checkout takes no commit, detached included; rk worktree add <branch> seats work in its own worktree" >&2; exit 1; }; [ "$branch" = master ] && exit 0; echo "this project works in worktrees — the main checkout holds the trunk and takes no branch commit; rk worktree add $branch gives this branch its own worktree" >&2; exit 1'
      - id: rk-no-force-push-to-trunk
        name: rk no force push to trunk
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$PRE_COMMIT_REMOTE_BRANCH" = refs/heads/master ] || exit 0; listed=$(git ls-remote "${PRE_COMMIT_REMOTE_URL:-$PRE_COMMIT_REMOTE_NAME}" refs/heads/master) || { echo "the remote master cannot be read, so a push to it is refused" >&2; exit 1; }; remote=${listed%%[[:space:]]*}; tracked=$(git rev-parse --verify --quiet "refs/remotes/$PRE_COMMIT_REMOTE_NAME/master"); for base in "$remote" "$PRE_COMMIT_FROM_REF" "$tracked"; do case "$base" in "") continue;; *[!0]*) ;; *) continue;; esac; git cat-file -e "$base^{commit}" 2>/dev/null || { echo "refusing a force push to master, because the remote holds $base, which this clone has not fetched; fetch, then rebase onto the remote trunk" >&2; exit 1; }; git merge-base --is-ancestor "$base" "$PRE_COMMIT_TO_REF" 2>/dev/null && continue; echo "refusing a force push to master, because $base is not an ancestor of the pushed tip; rebase onto the remote trunk instead of rewriting it" >&2; exit 1; done'
      - id: rk-no-merge-commit-to-trunk
        name: rk no merge commit to trunk
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$PRE_COMMIT_REMOTE_BRANCH" = refs/heads/master ] || exit 0; tip=${PRE_COMMIT_TO_REF:-$PRE_COMMIT_LOCAL_BRANCH}; [ -n "$tip" ] || exit 0; case "$PRE_COMMIT_FROM_REF" in ""|*[!0]*) range=${PRE_COMMIT_FROM_REF:+$PRE_COMMIT_FROM_REF..}$tip;; *) range=$tip;; esac; merges=$(git rev-list --merges "$range") || { echo "the commits pushed to master cannot be listed, so the push is refused" >&2; exit 1; }; [ -z "$merges" ] && exit 0; echo "refusing a push that adds a merge commit to master, whose history stays linear; rebase instead" >&2; git log --oneline --no-walk $merges >&2; exit 1'
      - id: rk-no-hand-authored-tag
        name: rk no hand-authored tag
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'case "$PRE_COMMIT_REMOTE_BRANCH" in refs/tags/v*) echo "never author a tag; the release automation mints every v* tag" >&2; exit 1;; esac'
      - id: rk-status-check
        name: rk status check
        language: system
        pass_filenames: false
        entry: rk status --check --target .
        files: '^(\.github/workflows/|\.gitlab-ci\.yml$|\.gitlab/ci/|AGENTS\.md$|\.release-kit/|\.pre-commit-config\.yaml$|release-plz\.toml$|dist-workspace\.toml$|cliff\.toml$|VERSION$)'
# END release-kit
  # --- Housekeeping (auto-fix where possible) ---
  #
  # A generated file follows its generator, and no hook of this project
  # rewrites or judges it. Source: the dev-environment rule of nix-secrets
  # (home/apps/claude-session/rules/dev-environment.md). The generated files
  # and their generators:
  #   CHANGELOG.md                             release-plz
  #   SECURITY.md, .github/workflows/pr-title.yml,
  #   .github/workflows/release-plz.yml        rk, rendered whole
  #   .release-kit/manifest.json               rk
  #   .github/workflows/release.yml            cargo-dist
  #   Cargo.lock, flake.lock                   cargo, nix
  # Each tool excludes them in its own configuration: dprint.json,
  # dprint.markdown.json, .markdownlint-cli2.jsonc, _typos.toml, and
  # .editorconfig-checker.json; taplo skips Cargo.lock by itself. The fixers
  # and the pygrep link rules have no configuration, so each takes its own
  # exclude. The reading hooks keep them: the parsers, the secret scans, and
  # the merge-conflict and large-file checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # The manifest stages omit pre-merge-commit, which rk integrate runs.
        stages: [pre-commit, pre-push, pre-merge-commit, manual]
        args: [--markdown-linebreak-ext=md]
        exclude: '^(CHANGELOG\.md|SECURITY\.md|\.release-kit/manifest\.json|\.github/workflows/(pr-title|release-plz|release)\.yml|Cargo\.lock|flake\.lock)$'
      - id: end-of-file-fixer
        # The manifest stages omit pre-merge-commit, which rk integrate runs.
        stages: [pre-commit, pre-push, pre-merge-commit, manual]
        exclude: '^(CHANGELOG\.md|SECURITY\.md|\.release-kit/manifest\.json|\.github/workflows/(pr-title|release-plz|release)\.yml|Cargo\.lock|flake\.lock)$'
      - id: check-added-large-files
        # The manifest stages omit pre-merge-commit, which rk integrate runs.
        stages: [pre-commit, pre-push, pre-merge-commit, manual]
        args: ['--maxkb=16384']
      - id: check-case-conflict
      - id: check-merge-conflict
        args: ['--assume-in-merge']
      - id: check-shebang-scripts-are-executable
        # The manifest stages omit pre-merge-commit, which rk integrate runs.
        stages: [pre-commit, pre-push, pre-merge-commit, manual]
        # Rust inner attributes (`#![allow(...)]`) are not shebangs.
        exclude: '\.rs$'
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      - id: destroyed-symlinks
        # The manifest stages omit pre-merge-commit, which rk integrate runs.
        stages: [pre-commit, pre-push, pre-merge-commit, manual]
      - id: detect-private-key
      # - id: no-commit-to-branch

  - repo: https://github.com/maresb/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5
        exclude: '[-.]lock\.json$'

  # --- JSON / JSONC formatter: dprint (comment-safe autofix) ---
  #
  # dprint's json plugin formats JSON and JSONC (comments + trailing commas),
  # which the stdlib-based pretty-format-json cannot. check-json5 above stays the
  # syntax gate; dprint owns formatting. Config in the sibling `./dprint.json`
  # (plugin version pinned there). The devShell supplies dprint. Not at
  # pre-push — git push may strip PATH, and formatting is already applied by
  # commit time.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) upstream dprint publishes no pre-commit hook.
      - id: dprint
        name: dprint fmt (json/jsonc)
        # --allow-no-files: dprint exits 14 when every path it receives is one its
        # own configuration excludes, such as a commit of only a generated file.
        entry: dprint fmt --allow-no-files
        language: system
        files: '\.(json|jsonc|json5)$'
        pass_filenames: true
        stages: [pre-commit, pre-merge-commit, manual]

  # --- EditorConfig ---
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.8.0
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline, '-exclude', 'LICENSE']
        # Markdown is excluded: editorconfig-checker can't parse it — it flags
        # fenced-code-block interiors and the odd-width ordered-list
        # continuations CommonMark/dprint use (e.g. `1. ` -> 3 spaces), and
        # defaults to indent_size=4 even when unset. Markdown formatting is
        # owned by dprint + markdownlint-cli2 when those hooks are layered in.
        exclude: '\.md$'

  # --- Rust: format & lint (auto-fix) ---
  - repo: local
    hooks:
      # owner: devshell (project-environment) cargo fmt is part of the Rust toolchain that the devShell pins.
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      # owner: devshell (project-environment) cargo clippy is part of the Rust toolchain and builds the crate.
      - id: clippy-fix
        name: clippy auto-fix
        entry: cargo clippy --fix --allow-dirty --allow-staged --all-features -- -W clippy::all
        language: system
        types: [rust]
        pass_filenames: false

      # owner: devshell (project-environment) cargo clippy is part of the Rust toolchain and builds the crate.
      - id: clippy-strict
        name: clippy gate
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # owner: devshell (no-hook-language) upstream taplo publishes no pre-commit hook.
      - id: taplo-format
        name: taplo format
        entry: taplo format
        language: system
        types: [toml]

  # --- Tests (layered per the CLI testing pyramid) ---
  #
  # Uses cargo-nextest because it produces deterministic, token-efficient
  # output (suppresses stdout/stderr from passing tests by default) and
  # supports per-profile `default-filter` for clean test-kind layering.
  #
  # Test classification (per docs/explanation/testing-strategy.md and
  # docs/reference/testing-and-quality.md):
  #   - Unit:        `src/` inline `#[cfg(test)] mod tests`. One function
  #                  or module in isolation. kind(lib) for library crates;
  #                  kind(bin) when unit tests live inside a [[bin]] target
  #                  (binary-only crates with no [lib]).
  #   - Integration: `tests/*.rs`  (kind=test). Tests the *seam* between
  #                  components. The defining property is "tests the
  #                  interaction between things," NOT "touches real
  #                  things." A wrapper CLI exercising its argv contract
  #                  against a recording stub / faked child is integration.
  #   - E2E:         The whole product against real external systems
  #                  (real subprocess, real network, real container). E2E
  #                  belongs in CI ONLY — never pre-commit or pre-push:
  #                  too slow, too dependent on host state, too flaky to
  #                  gate local commits. Do NOT add an E2E hook here.
  #   - Doc tests:   `///` doctests in library items. NOT runnable by
  #                  nextest — covered by the separate `cargo test --doc`
  #                  hook below.
  #
  # Tier-to-hook mapping (per docs/reference/testing-and-quality.md § Lanes):
  #   - pre-commit: unit only            (sub-second budget)
  #   - pre-push:   unit + integration   (single-digit-seconds budget)
  #   - CI:         everything + E2E     (live in .github/workflows)
  #
  # Every pre-push hook also runs at `manual`, the stage `rk integrate` runs
  # before it writes the trunk commit (ADR-0126), and pre-push re-validates
  # the trunk on its push. The unit hook is wired to `pre-commit` as well:
  # it's nearly free and guards against committed-but-not-tested changes
  # (rebases, amends) reaching the trunk.
  #
  # Requires:
  #   - `cargo nextest`, which the devShell supplies
  #   - `.config/nextest.toml` defining the `pre-commit` and `pre-push`
  #     profiles. A canonical copy lives in this template at
  #     `.config/nextest.toml`; the `/pre-commit` skill mirrors it into
  #     `<repo>/.config/nextest.toml`.
  - repo: local
    hooks:
      # owner: devshell (project-environment) cargo nextest runs the test suite of the crate.
      - id: cargo-nextest-unit
        name: cargo nextest (unit tests)
        entry: cargo nextest run --profile pre-commit --all-features --no-tests=pass
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit, pre-push, pre-merge-commit, manual]

      # owner: devshell (project-environment) cargo nextest runs the test suite of the crate.
      - id: cargo-nextest-integration
        name: cargo nextest (integration tests)
        entry: cargo nextest run --profile pre-push --all-features --no-tests=pass
        language: system
        # `always_run`, not a file filter: the integration lane admits the bytes
        # of checked-in repository files (docs/reference/testing-and-quality.md),
        # so the collision audit and the repository contracts take Markdown,
        # YAML, TOML, and Rust sources as inputs. A `types_or` list narrow
        # enough to be a filter would skip a push that changes only those
        # inputs, which is exactly the change these gates exist to catch, and
        # one wide enough to cover them would match every file anyway.
        always_run: true
        pass_filenames: false
        stages: [pre-push, pre-merge-commit, manual]

      # `always_run` with no filenames: a generated example's relationship is to
      # the whole configuration model rather than to any one changed file, so a
      # file filter would skip exactly the commit that made it stale.
      # owner: devshell (project-environment) cargo xtask runs code of this workspace.
      - id: gen-config
        name: cargo xtask gen-config (generated examples)
        entry: cargo xtask gen-config
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit, pre-merge-commit, manual]

      # owner: devshell (no-hook-language) a script of this repository that runs cargo nextest from the devShell.
      - id: acceptance-test-ids
        name: resolve slice acceptance test IDs
        entry: scripts/check-acceptance-tests
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push, pre-merge-commit, manual]

      # owner: devshell (project-environment) cargo test --doc runs the doctests of the crate.
      - id: cargo-doc-tests
        name: cargo test --doc (doctests)
        # Guard: doctests only exist in library targets. This is a
        # binary-only crate (no [lib]), so run `cargo test --doc` only when
        # a lib target is actually present — otherwise cargo exits 101 with
        # "no library targets found". Remove the guard once a lib is added.
        entry: bash -c 'if cargo metadata --no-deps --format-version 1 | grep -q "\"kind\":\[\"lib\"\]"; then cargo test --doc --all-features; else echo "no library target; skipping doctests"; fi'
        language: system
        types_or: [rust, toml]
        pass_filenames: false
        stages: [pre-push, pre-merge-commit, manual]

  # --- Spell check ---
  #
  # The upstream hook, `language: python`, pinned at the version the devShell
  # carried. Its wheel holds a prebuilt binary that links the standard ELF
  # loader, which the host supplies (nix-ld on a NixOS host), so the reason for
  # a system hook is gone. Its args are the upstream defaults.
  #
  # Commit-message linting was `committed` here. The release-kit block above
  # now owns that job through conventional-pre-commit and rk-message, and two
  # hooks on one job is what the landing's reconciliation forbids (ADR-0118).
  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      - id: typos
        types: [text]
        stages: [pre-commit, pre-merge-commit, pre-push, manual]

  # --- Secret scanning (pre-commit, fast) ---
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets

  # --- Heavy checks (pre-push and manual) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks git --redact --verbose
        pass_filenames: false
        stages: [pre-push, pre-merge-commit, manual]

  # --- Unused dependency detection ---
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.9.2
    hooks:
      - id: cargo-machete
        stages: [pre-push, pre-merge-commit, manual]

  - repo: local
    hooks:
      # owner: devshell (project-environment) cargo audit is a cargo subcommand that reads the lock file of the crate.
      - id: cargo-audit
        name: cargo audit
        entry: cargo audit
        language: system
        pass_filenames: false
        stages: [pre-push, pre-merge-commit, manual]

      # `licenses` is enabled: this repo carries a deny.toml with a filled
      # allow-list, and Cargo.toml declares `license = "MIT OR Apache-2.0"`.
      # owner: devshell (project-environment) cargo deny is a cargo subcommand that reads the lock file of the crate.
      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check advisories bans sources licenses
        language: system
        pass_filenames: false
        stages: [pre-push, pre-merge-commit, manual]

      # cargo-deny prints nothing for an ignored advisory, so this hook prints
      # each one with its reason and always passes. `verbose` shows the output
      # of a passing hook.
      # owner: devshell (no-hook-language) a script of this repository that reads deny.toml with taplo.
      - id: report-ignored-advisories
        name: report ignored advisories
        entry: scripts/report-ignored-advisories
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [pre-push, pre-merge-commit, manual]

  # --- Shell: lint + format (scripts/ ships installable helpers) ---
  #
  # This repo ships extension-less executable bash helpers under `scripts/`
  # (publish, publish-dry, release), which pre-commit identifies as `shell` via
  # their shebang. shellcheck is the static-analysis gate; shfmt is the
  # formatter, pinned to 2-space indent (the shell convention, and what the
  # existing scripts already use). .editorconfig mirrors this with
  # `indent_size = 2` for [*.sh] and [scripts/*] so ec agrees with shfmt.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: ["-i", "2", "-ci"]

  # --- Nix: format (auto-fix) + lint (gate) ---
  #
  # Every project carries a per-project flake devShell, so these run against its
  # Nix sources. nixfmt and statix come from that devShell (nix develop /
  # direnv) and run as system hooks off PATH, like dprint/cargo-fmt; deadnix
  # runs as its upstream hook below. nixfmt (RFC 166, the
  # nixpkgs-standard formatter) rewrites in place; statix and deadnix are
  # report-only gates — fix by hand or allowlist. statix walks the tree itself,
  # so its scope/ignore lives in the sibling `./statix.toml`. `nix flake check`
  # evaluates the flake and is scoped to Nix changes, at the pre-push stage.
  - repo: local
    hooks:
      # owner: devshell (outside-caller) nix fmt runs the formatter of this flake, pkgs.nixfmt, so the hook runs the same one.
      - id: nixfmt
        name: nixfmt (format)
        entry: nixfmt
        language: system
        types: [nix]
        stages: [pre-commit, pre-merge-commit, manual]
      # owner: devshell (no-hook-language) statix has no hook in a language that the hook runner builds.
      - id: statix
        name: statix (nix anti-patterns)
        entry: statix check
        language: system
        types: [nix]
        pass_filenames: false
        stages: [pre-commit, pre-merge-commit, manual]
      # owner: host (no-hook-language) nix comes from the host and has no hook in a language that the hook runner builds.
      - id: nix-flake-check
        name: nix flake check (eval)
        entry: nix flake check
        language: system
        files: '\.nix$'
        pass_filenames: false
        stages: [pre-push, pre-merge-commit, manual]

  # deadnix publishes a rust hook, which the hook runner builds; its manifest
  # carries --fail and the nix file type.
  - repo: https://github.com/astro/deadnix
    rev: v1.3.2
    hooks:
      - id: deadnix
        stages: [pre-commit, pre-merge-commit, manual]
  - repo: local
    hooks:
      # A flake holds no language library: a package belongs to the manifest
      # of its stack, and the devShell keeps the toolchain.
      - id: no-language-library-in-flake
        name: a flake holds no language library
        language: pygrep
        entry: '^(?!\s*#).*(withPackages|python3[0-9]*Packages\.|pythonPackages\.|nodePackages\.|perlPackages\.)'
        files: '(^|/)flake\.nix$|(^|/)nix/.*\.nix$'
        stages: [pre-commit]
  # --- Markdown: canonical format (dprint) + style gate (markdownlint) ---
  #
  # Universal overlay: every project carries docs/READMEs, so its markdown is
  # formatted and linted everywhere — the same model as the shared Nix overlay.
  # dprint owns canonical formatting; `markdown.textWrap: "never"` (in the sibling
  # ./dprint.markdown.json) unwraps every soft-wrapped paragraph to one continuous
  # physical line for small diffs and predictable LLM tokens. Explicit hard breaks
  # (two trailing spaces / trailing `\`) are preserved, fenced code blocks are left
  # unreflowed, and tables stay intact. markdownlint-cli2 gates style beyond what
  # dprint enforces and autofixes the one thing dprint can't — ordered-list
  # renumbering (MD029); rules live in the sibling ./.markdownlint-cli2.jsonc.
  #
  # A dedicated ./dprint.markdown.json + `--config` keeps this invocation
  # independent of the type's own JSON dprint.json, and the `dprint-markdown` id
  # never collides with the type's `dprint` hook.
  #
  # The devShell supplies dprint, the same model as the json/nix hooks. Not at
  # pre-push —
  # git push may strip PATH and the format is already applied by commit time.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) upstream dprint publishes no pre-commit hook.
      - id: dprint-markdown
        name: dprint fmt (markdown)
        # --allow-no-files, for the same reason as the JSON hook above.
        entry: dprint fmt --config dprint.markdown.json --allow-no-files
        language: system
        files: '\.(md|markdown)$'
        pass_filenames: true
        stages: [pre-commit, pre-merge-commit, manual]

  # --- Explicit relative links (ambiguity guard; pre-commit, local) ---
  #
  # A bare-filename relative link like [x](runbook.md) is ambiguous: the same
  # basename can exist in many directories, so neither humans nor tools can tell
  # which file is meant, and the link silently rots when a file moves. Require an
  # explicit prefix: ./name, ../dir/name, or a multi-segment path dir/name.
  # Fragment-only (#...), root-absolute (/...), and URL links pass. pygrep is
  # built into pre-commit — no external dependency, no companion file.
  - repo: local
    hooks:
      - id: no-bare-relative-links
        name: inline markdown links must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        entry: '\]\((?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/)[^)/\s:]+\.[A-Za-z0-9]+(?:#[^)]*)?\)'
        exclude: '^(CHANGELOG|SECURITY)\.md$'
      - id: no-bare-relative-link-defs
        name: markdown link definitions must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        entry: '^\s*\[[^\]]+\]:\s+(?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/|<)[^\s/:#]+\.[A-Za-z0-9]+'
        exclude: '^(CHANGELOG|SECURITY)\.md$'

  # --- Markdown lint (style gate + ordered-list renumber autofix) ---
  #
  # markdownlint-cli2 runs AFTER dprint. dprint owns all formatting; markdownlint
  # flags issues dprint can't normalize (heading hierarchy, link integrity) AND
  # autofixes ordered-list renumbering (MD029). The custom `relative-links` rule
  # (report-only) verifies an explicit relative target actually resolves on disk,
  # complementing the pygrep FORM guards above (form vs. existence). Configure via
  # the sibling ./.markdownlint-cli2.jsonc. Uses the node variant.
  #
  # `language_version: system` is required, not an optimization (ADR-0040).
  # pre-commit only picks system node on its own when node and npm resolve
  # OUTSIDE $HOME; under a home-profile Nix install they do not, so it falls back
  # to nodeenv and downloads a generic-glibc node that cannot exec on a Nix host.
  # Naming the version explicitly bypasses that detection and uses the devShell's
  # node, which still runs npm to install the pure-JS custom rule below.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']

      # --- Heading shapes (MD043) ---
      #
      # MD043 takes one ordered heading array and markdownlint has no per-glob rule
      # configuration, so a shape narrower than a whole subtree cannot be expressed
      # in a config file alone: `docs/plan/slices/<id>/README.md` and the `tasks.md`
      # beside it need different arrays, and `milestones.md` sits next to a charter
      # with a different shape again. The seam that takes a filter is the
      # invocation — one array per shape in ./.markdownlint/, one entry per shape
      # here to choose the documents it applies to.
      #
      # These are overlays. Every other rule still comes from
      # ./.markdownlint-cli2.jsonc, which is discovered for the working directory
      # and merged OVER the --config base. That merge is why MD043 must not appear
      # in that file at any value: an explicit `false` there silently switches off
      # every shape below while these hooks keep reporting success.
      #
      # Each array is asserted equal to its Rust constant by the repository
      # contracts, so the shape has one owner rather than two that can disagree.
      - id: markdownlint-cli2
        alias: md-slice-readme
        name: markdownlint (slice entry heading shape)
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']
        files: '^docs/plan/slices/[^/]+/README\.md$'
        args: ['--config', '.markdownlint/slice-readme.markdownlint-cli2.jsonc']

      - id: markdownlint-cli2
        alias: md-milestones
        name: markdownlint (milestones heading shape)
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']
        files: '^docs/plan/milestones\.md$'
        args: ['--config', '.markdownlint/milestones.markdownlint-cli2.jsonc']

      - id: markdownlint-cli2
        alias: md-adr
        name: markdownlint (decision record heading shape)
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']
        files: '^docs/decisions/(ADR-[0-9]+-.*|template)\.md$'
        args: ['--config', '.markdownlint/adr.markdownlint-cli2.jsonc']
  # A flake reference reads the git tree of a checkout, never a path copy of
  # the whole folder into the Nix store. A flake holds no git hook runner, and
  # host-requirements.toml parses whenever it changes. The three hooks are
  # published by exobrain-tech, whose `exobrain` comes from the devShell.
  - repo: https://github.com/gubasso/exobrain-tech
    rev: v1.1.0
    hooks:
      - id: no-path-flake-reference
      - id: no-hook-runner-in-flake
      # owner: devshell (no-hook-language) exobrain-tech publishes this hook
      # only as system. It runs exobrain host-check --parse-only from the flake
      # devShell each time host-requirements.toml changes.
      - id: host-requirements
