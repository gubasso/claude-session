default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
# BEGIN release-kit
# The release convention's hooks. Install every stage they run at:
# pre-commit install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
# A CI sweep commits nothing, so a job running pre-commit against a trunk
# checkout sets SKIP=no-commit-to-branch,rk-worktree-location in its environment.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --force-scope]
  - repo: local
    hooks:
      - id: rk-message
        name: rk message content
        stages: [commit-msg]
        language: system
        entry: rk message --check
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, master]
  - repo: local
    hooks:
      - id: rk-branch-name
        name: rk branch name
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'branch=$(git symbolic-ref --quiet --short HEAD) || exit 0; [ "$branch" = master ] && exit 0; printf %s "$branch" | grep -Eq "^((build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)/[A-Za-z0-9._/-]+|([0-9]+|[A-Z][A-Z0-9]+-[0-9]+)-[A-Za-z0-9._-]+|release[-/].+)$" && exit 0; echo "branch $branch is neither <type>/<slug> nor <issue-id>-<slug>; gh issue develop <issue> --checkout or its glab counterpart mints the linked form" >&2; exit 1'
      - id: rk-worktree-location
        name: rk worktree location
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$(git rev-parse --git-dir)" = "$(git rev-parse --git-common-dir)" ] || exit 0; branch=$(git symbolic-ref --quiet --short HEAD) || { echo "this project works in worktrees — the main checkout takes no commit, detached included; rk worktree add <branch> seats work in its own worktree" >&2; exit 1; }; [ "$branch" = master ] && exit 0; echo "this project works in worktrees — the main checkout takes no branch commit, as the forge trunk takes no direct push; rk worktree add $branch gives this branch its own worktree" >&2; exit 1'
      - id: rk-no-push-to-trunk
        name: rk no push to trunk
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$PRE_COMMIT_REMOTE_BRANCH" != refs/heads/master ] || { echo "the trunk takes no direct push; it is written through squash-merged pull requests alone" >&2; exit 1; }'
      - id: rk-no-hand-authored-tag
        name: rk no hand-authored tag
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'case "$PRE_COMMIT_REMOTE_BRANCH" in refs/tags/v*) echo "never author a tag; the release automation mints every v* tag" >&2; exit 1;; esac'
      - id: rk-status-check
        name: rk status check
        language: system
        pass_filenames: false
        entry: rk status --check --target .
        files: '^(\.github/workflows/|\.gitlab-ci\.yml$|\.gitlab/ci/|AGENTS\.md$|\.release-kit/|\.pre-commit-config\.yaml$|release-plz\.toml$|dist-workspace\.toml$|release-please-config\.json$|cliff\.toml$|\.release-please-manifest\.json$|VERSION$)'
# END release-kit
  # --- Housekeeping (auto-fix where possible) ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ['--maxkb=16384']
      - id: check-case-conflict
      - id: check-merge-conflict
        args: ['--assume-in-merge']
      - id: check-shebang-scripts-are-executable
        # Rust inner attributes (`#![allow(...)]`) are not shebangs.
        exclude: '\.rs$'
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      - id: destroyed-symlinks
      - id: detect-private-key
      # - id: no-commit-to-branch

  - repo: https://github.com/maresb/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5
        exclude: '[-.]lock\.json$'

  # --- JSON / JSONC formatter: dprint (comment-safe autofix) ---
  #
  # dprint's json plugin formats JSON and JSONC (comments + trailing commas),
  # which the stdlib-based pretty-format-json cannot. check-json5 above stays the
  # syntax gate; dprint owns formatting. Config in the sibling `./dprint.json`
  # (plugin version pinned there). External dependency: dprint must be on PATH
  # (`cargo install dprint` or your package manager). pre-commit only — git push
  # may strip PATH, and formatting is already applied by commit time.
  - repo: local
    hooks:
      - id: dprint
        name: dprint fmt (json/jsonc)
        entry: dprint fmt
        language: system
        files: '\.(json|jsonc|json5)$'
        pass_filenames: true
        stages: [pre-commit]

  # --- EditorConfig ---
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.8.0
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline, '-exclude', 'LICENSE']
        # Markdown is excluded: editorconfig-checker can't parse it — it flags
        # fenced-code-block interiors and the odd-width ordered-list
        # continuations CommonMark/dprint use (e.g. `1. ` -> 3 spaces), and
        # defaults to indent_size=4 even when unset. Markdown formatting is
        # owned by dprint + markdownlint-cli2 when those hooks are layered in.
        exclude: '\.md$'

  # --- Rust: format & lint (auto-fix) ---
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy-fix
        name: clippy auto-fix
        entry: cargo clippy --fix --allow-dirty --allow-staged --all-features -- -W clippy::all
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy-strict
        name: clippy gate
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: taplo-format
        name: taplo format
        entry: taplo format
        language: system
        types: [toml]

  # --- Tests (layered per the CLI testing pyramid) ---
  #
  # Uses cargo-nextest because it produces deterministic, token-efficient
  # output (suppresses stdout/stderr from passing tests by default) and
  # supports per-profile `default-filter` for clean test-kind layering.
  #
  # Test classification (per docs/explanation/testing-strategy.md and
  # docs/reference/testing-and-quality.md):
  #   - Unit:        `src/` inline `#[cfg(test)] mod tests`. One function
  #                  or module in isolation. kind(lib) for library crates;
  #                  kind(bin) when unit tests live inside a [[bin]] target
  #                  (binary-only crates with no [lib]).
  #   - Integration: `tests/*.rs`  (kind=test). Tests the *seam* between
  #                  components. The defining property is "tests the
  #                  interaction between things," NOT "touches real
  #                  things." A wrapper CLI exercising its argv contract
  #                  against a recording stub / faked child is integration.
  #   - E2E:         The whole product against real external systems
  #                  (real subprocess, real network, real container). E2E
  #                  belongs in CI ONLY — never pre-commit or pre-push:
  #                  too slow, too dependent on host state, too flaky to
  #                  gate local commits. Do NOT add an E2E hook here.
  #   - Doc tests:   `///` doctests in library items. NOT runnable by
  #                  nextest — covered by the separate `cargo test --doc`
  #                  hook below.
  #
  # Tier-to-hook mapping (per docs/reference/testing-and-quality.md § Lanes):
  #   - pre-commit: unit only            (sub-second budget)
  #   - pre-push:   unit + integration   (single-digit-seconds budget)
  #   - CI:         everything + E2E     (live in .github/workflows)
  #
  # The unit hook is therefore wired to BOTH `pre-commit` and `pre-push`
  # stages: it's nearly free and guards against committed-but-not-tested
  # changes (rebases, amends) reaching the remote.
  #
  # Requires:
  #   - `cargo nextest` on PATH (cargo install --locked cargo-nextest)
  #   - `.config/nextest.toml` defining the `pre-commit` and `pre-push`
  #     profiles. A canonical copy lives in this template at
  #     `.config/nextest.toml`; the `/pre-commit` skill mirrors it into
  #     `<repo>/.config/nextest.toml`.
  - repo: local
    hooks:
      - id: cargo-nextest-unit
        name: cargo nextest (unit tests)
        entry: cargo nextest run --profile pre-commit --all-features --no-tests=pass
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: cargo-nextest-integration
        name: cargo nextest (integration tests)
        entry: cargo nextest run --profile pre-push --all-features --no-tests=pass
        language: system
        # `always_run`, not a file filter: the integration lane admits the bytes
        # of checked-in repository files (docs/reference/testing-and-quality.md),
        # so the collision audit and the repository contracts take Markdown,
        # YAML, TOML, and Rust sources as inputs. A `types_or` list narrow
        # enough to be a filter would skip a push that changes only those
        # inputs, which is exactly the change these gates exist to catch, and
        # one wide enough to cover them would match every file anyway.
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      # `always_run` with no filenames: a generated example's relationship is to
      # the whole configuration model rather than to any one changed file, so a
      # file filter would skip exactly the commit that made it stale.
      - id: gen-config
        name: cargo xtask gen-config (generated examples)
        entry: cargo xtask gen-config
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: acceptance-test-ids
        name: resolve slice acceptance test IDs
        entry: scripts/check-acceptance-tests
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-doc-tests
        name: cargo test --doc (doctests)
        # Guard: doctests only exist in library targets. This is a
        # binary-only crate (no [lib]), so run `cargo test --doc` only when
        # a lib target is actually present — otherwise cargo exits 101 with
        # "no library targets found". Remove the guard once a lib is added.
        entry: bash -c 'if cargo metadata --no-deps --format-version 1 | grep -q "\"kind\":\[\"lib\"\]"; then cargo test --doc --all-features; else echo "no library target; skipping doctests"; fi'
        language: system
        types_or: [rust, toml]
        pass_filenames: false
        stages: [pre-push]

  # --- Spell check (system binary from the devShell) ---
  #
  # crate-ci publishes this as a `language: python` hook whose wheel carries a
  # prebuilt generic-glibc binary. That binary names
  # /lib64/ld-linux-x86-64.so.2 as its ELF interpreter, which does not exist on a
  # Nix host, so the hook installs cleanly and then fails at exec with a bare
  # ENOENT. There is no configuration knob for it; the fix is to take the
  # binary from the flake devShell instead (ADR-0040). nixpkgs carries it at
  # the version this file previously pinned.
  #
  # Args mirror the upstream hook definition so behaviour is unchanged.
  #
  # Commit-message linting was `committed` here. The release-kit block above
  # now owns that job through conventional-pre-commit and rk-message, and two
  # hooks on one job is what the landing's reconciliation forbids (ADR-0118).
  - repo: local
    hooks:
      - id: typos
        name: typos
        entry: typos --write-changes --force-exclude
        language: system
        types: [text]
        stages: [pre-commit, pre-merge-commit, pre-push, manual]

  # --- Secret scanning (pre-commit, fast) ---
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets

  # --- Heavy checks (pre-push only) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks git --redact --verbose
        pass_filenames: false
        stages: [pre-push]

  # --- Unused dependency detection ---
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.9.2
    hooks:
      - id: cargo-machete
        stages: [pre-push]

  - repo: local
    hooks:
      - id: cargo-audit
        name: cargo audit
        entry: cargo audit
        language: system
        pass_filenames: false
        stages: [pre-push]

      # `licenses` is enabled: this repo carries a deny.toml with a filled
      # allow-list, and Cargo.toml declares `license = "MIT OR Apache-2.0"`.
      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check advisories bans sources licenses
        language: system
        pass_filenames: false
        stages: [pre-push]

  # --- Shell: lint + format (scripts/ ships installable helpers) ---
  #
  # This repo ships extension-less executable bash helpers under `scripts/`
  # (publish, publish-dry, release), which pre-commit identifies as `shell` via
  # their shebang. shellcheck is the static-analysis gate; shfmt is the
  # formatter, pinned to 2-space indent (the shell convention, and what the
  # existing scripts already use). .editorconfig mirrors this with
  # `indent_size = 2` for [*.sh] and [scripts/*] so ec agrees with shfmt.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: ["-i", "2", "-ci"]

  # --- Nix: format (auto-fix) + lint (gate) ---
  #
  # Every project carries a per-project flake devShell, so these run against its
  # Nix sources. Tools come from that devShell (nix develop / direnv) and run as
  # system hooks off PATH, like dprint/cargo-fmt. nixfmt (RFC 166, the
  # nixpkgs-standard formatter) rewrites in place; statix and deadnix are
  # report-only gates — fix by hand or allowlist. statix walks the tree itself,
  # so its scope/ignore lives in the sibling `./statix.toml`. `nix flake check`
  # evaluates the flake and is scoped to Nix changes, at the pre-push stage.
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt (format)
        entry: nixfmt
        language: system
        types: [nix]
        stages: [pre-commit]
      - id: statix
        name: statix (nix anti-patterns)
        entry: statix check
        language: system
        types: [nix]
        pass_filenames: false
        stages: [pre-commit]
      - id: deadnix
        name: deadnix (dead code)
        entry: deadnix --fail
        language: system
        types: [nix]
        stages: [pre-commit]
      - id: nix-flake-check
        name: nix flake check (eval)
        entry: nix flake check
        language: system
        files: '\.nix$'
        pass_filenames: false
        stages: [pre-push]

  # --- Markdown: canonical format (dprint) + style gate (markdownlint) ---
  #
  # Universal overlay: every project carries docs/READMEs, so its markdown is
  # formatted and linted everywhere — the same model as the shared Nix overlay.
  # dprint owns canonical formatting; `markdown.textWrap: "never"` (in the sibling
  # ./dprint.markdown.json) unwraps every soft-wrapped paragraph to one continuous
  # physical line for small diffs and predictable LLM tokens. Explicit hard breaks
  # (two trailing spaces / trailing `\`) are preserved, fenced code blocks are left
  # unreflowed, and tables stay intact. markdownlint-cli2 gates style beyond what
  # dprint enforces and autofixes the one thing dprint can't — ordered-list
  # renumbering (MD029); rules live in the sibling ./.markdownlint-cli2.jsonc.
  #
  # A dedicated ./dprint.markdown.json + `--config` keeps this invocation
  # independent of the type's own JSON dprint.json, and the `dprint-markdown` id
  # never collides with the type's `dprint` hook.
  #
  # External dependency: dprint must be on PATH (`cargo install dprint` or your
  # package manager), the same model as the json/nix hooks. pre-commit only —
  # git push may strip PATH and the format is already applied by commit time.
  - repo: local
    hooks:
      - id: dprint-markdown
        name: dprint fmt (markdown)
        entry: dprint fmt --config dprint.markdown.json
        language: system
        files: '\.(md|markdown)$'
        pass_filenames: true
        stages: [pre-commit]

  # --- Explicit relative links (ambiguity guard; pre-commit, local) ---
  #
  # A bare-filename relative link like [x](runbook.md) is ambiguous: the same
  # basename can exist in many directories, so neither humans nor tools can tell
  # which file is meant, and the link silently rots when a file moves. Require an
  # explicit prefix: ./name, ../dir/name, or a multi-segment path dir/name.
  # Fragment-only (#...), root-absolute (/...), and URL links pass. pygrep is
  # built into pre-commit — no external dependency, no companion file.
  - repo: local
    hooks:
      - id: no-bare-relative-links
        name: inline markdown links must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        entry: '\]\((?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/)[^)/\s:]+\.[A-Za-z0-9]+(?:#[^)]*)?\)'
      - id: no-bare-relative-link-defs
        name: markdown link definitions must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        entry: '^\s*\[[^\]]+\]:\s+(?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/|<)[^\s/:#]+\.[A-Za-z0-9]+'

  # --- Markdown lint (style gate + ordered-list renumber autofix) ---
  #
  # markdownlint-cli2 runs AFTER dprint. dprint owns all formatting; markdownlint
  # flags issues dprint can't normalize (heading hierarchy, link integrity) AND
  # autofixes ordered-list renumbering (MD029). The custom `relative-links` rule
  # (report-only) verifies an explicit relative target actually resolves on disk,
  # complementing the pygrep FORM guards above (form vs. existence). Configure via
  # the sibling ./.markdownlint-cli2.jsonc. Uses the node variant.
  #
  # `language_version: system` is required, not an optimization (ADR-0040).
  # pre-commit only picks system node on its own when node and npm resolve
  # OUTSIDE $HOME; under a home-profile Nix install they do not, so it falls back
  # to nodeenv and downloads a generic-glibc node that cannot exec on a Nix host.
  # Naming the version explicitly bypasses that detection and uses the devShell's
  # node, which still runs npm to install the pure-JS custom rule below.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']

      # --- Heading shapes (MD043) ---
      #
      # MD043 takes one ordered heading array and markdownlint has no per-glob rule
      # configuration, so a shape narrower than a whole subtree cannot be expressed
      # in a config file alone: `docs/plan/slices/<id>/README.md` and the `tasks.md`
      # beside it need different arrays, and `milestones.md` sits next to a charter
      # with a different shape again. The seam that takes a filter is the
      # invocation — one array per shape in ./.markdownlint/, one entry per shape
      # here to choose the documents it applies to.
      #
      # These are overlays. Every other rule still comes from
      # ./.markdownlint-cli2.jsonc, which is discovered for the working directory
      # and merged OVER the --config base. That merge is why MD043 must not appear
      # in that file at any value: an explicit `false` there silently switches off
      # every shape below while these hooks keep reporting success.
      #
      # Each array is asserted equal to its Rust constant by the repository
      # contracts, so the shape has one owner rather than two that can disagree.
      - id: markdownlint-cli2
        alias: md-slice-readme
        name: markdownlint (slice entry heading shape)
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']
        files: '^docs/plan/slices/[^/]+/README\.md$'
        args: ['--config', '.markdownlint/slice-readme.markdownlint-cli2.jsonc']

      - id: markdownlint-cli2
        alias: md-milestones
        name: markdownlint (milestones heading shape)
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']
        files: '^docs/plan/milestones\.md$'
        args: ['--config', '.markdownlint/milestones.markdownlint-cli2.jsonc']

      - id: markdownlint-cli2
        alias: md-adr
        name: markdownlint (decision record heading shape)
        language_version: system
        additional_dependencies: ['markdownlint-rule-relative-links']
        files: '^docs/decisions/(ADR-[0-9]+-.*|template)\.md$'
        args: ['--config', '.markdownlint/adr.markdownlint-cli2.jsonc']
