# Measured inventory of the child command's top-level and per-subcommand
# spellings. Read only by the collision audit in ../collision_audit/, which never
# spawns the child and never uses the network: this file is the child fact the
# audit compares the wrapper's claimed set against (ADR-0044).
#
# Regenerating it is a measurement, not a test run. Follow the revalidation the
# docs/reference/cli-surface.md entry in
# ../../docs/reference/research-tracking.yaml describes, then update
# child_version, measured_on, and the prose datelines in
# ../../docs/reference/cli-surface.md that name the same version and date.
#
# Every list is byte-sorted, unique, and quoted, one spelling per line, so
# adopting a new child version is a reviewable diff.

child_version: "2.1.220"
measured_on: "2026-08-06"
source_command: "claude --help, then claude <verb> --help for each verb below"

top_level_flags:
