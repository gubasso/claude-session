# A spelling whose meaning is another spelling's, rather than a separate flag. A
# claimed wrapper spelling appearing as a key here would change a token's
# meaning rather than shadow it, which ADR-0044 forbids outright; that is why
# `-v` is absent from the wrapper's denylist.
aliases:
  "-v": "--version"

# Keyed by a member of top_level_verbs. A verb-level wrapper flag costs the
# child nothing except on a composed verb, and cli-surface.md carries no
# verb-level flag table yet, so the audit asserts only the shape of this map
# today. The per-subcommand comparison turns on with doctor's flag table.
subcommand_flags:
  agents:
    - "--add-dir"
    - "--agent"
    - "--all"
    - "--allow-dangerously-skip-permissions"
    - "--cwd"
    - "--dangerously-skip-permissions"
    - "--effort"
