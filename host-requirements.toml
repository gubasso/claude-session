# The host tools that the justfile, the git hooks, and scripts/ of claude-session
# call, read from that code. The flake devShell, Cargo.toml, and
# .pre-commit-config.yaml own every other tool, so none of those appear here.
# The POSIX base tools are not listed. `exobrain host-check` reads this file:
# the justfile checks the global tools once per run, and a recipe that alone
# uses a tool checks it as its first line. The convention and the checker
# belong to exobrain-tech.
schema = 1

# Global. Every recipe runs through `nix develop` (flakes enabled), and the
# hooks call git.
[tools.nix]

[tools.git]

# Path-scoped: the git hooks, and the hooks and hooks-install recipes. prek
# enforces its own version through minimum_prek_version in
# .pre-commit-config.yaml, so the file names no floor.
[tools.prek]
version = "*"
