# CI for claude-session.
#
# Every job reuses the pinned Nix devShell from flake.nix (devShells.default),
# so CI, the pre-commit hooks, and local `just` runs all share one toolchain —
# the rust-overlay toolchain read from rust-toolchain.toml plus cargo-nextest,
# cargo-deny, cargo-audit and taplo.
#
# The justfile prefixes every recipe with `nix develop --command` (its `dev`
# variable). CI enters the devShell ONCE per step and overrides that prefix with
# `dev=""`, so recipes run directly instead of nesting a second `nix develop`.
#
#     nix develop --command just dev="" fmt-check lint
#
# Requires flake.lock to be committed — Nix flakes only see git-tracked files,
# and an uncommitted/absent lock makes every job fail on evaluation.
#
# Publishing lives in a separate workflow (.github/workflows/release-plz.yml);
# never add a publish step here.
name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Nix cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      - name: Format check and clippy
        run: nix develop --command just dev="" fmt-check lint
      - name: Generated examples are fresh
        run: nix develop --command just dev="" gen-config-check

  test:
    name: test (nextest, ci profile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Nix cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      - name: Test
        run: nix develop --command just dev="" test-ci

  build:
    name: build (release) + docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Nix cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      - name: Build release binary and docs
        run: nix develop --command just dev="" build-release doc

  supply-chain:
    name: supply chain (audit + deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Nix cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      - name: Audit and deny
        run: nix develop --command just dev="" audit deny

  flake:
    name: nix build + flake check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Nix cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      # `nix flake check` builds only the `checks` output, so on its own it
      # would go green having never compiled nix/package.nix. The explicit
      # build is what proves the packaging capability (ADR-0119).
      - name: Build the package
        run: nix build .#default
      - name: Flake check
        run: nix flake check

  dist-plan:
    name: dist (generate check + plan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      # dist-workspace.toml sets pr-run-mode = "skip", so the generated
      # release.yml reports nothing on a request. These two proofs run here
      # instead, in the file the required gate can reach.
      - name: Install dist at the configured pin
        run: |
          set -euo pipefail
          pin="$(grep -m1 '^cargo-dist-version' dist-workspace.toml | cut -d'"' -f2)"
          [ -n "$pin" ] || { echo "dist-workspace.toml names no cargo-dist-version"; exit 1; }
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v$pin/cargo-dist-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "DIST_PIN=$pin" >> "$GITHUB_ENV"
      - name: dist runs at the configured pin
        run: dist --version | grep -Fq "$DIST_PIN"
      # The tracked check runs first: `git diff` compares the index with the
      # working tree and shows no untracked path, so without it a request
      # deleting the workflow would regenerate it and diff clean.
      - name: The committed workflow is what the pin produces
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- .github/workflows/release.yml > /dev/null
          dist generate --mode ci
          git diff --exit-code -- .github/workflows/release.yml
      - name: The configuration produces a viable release
        id: plan
        run: |
          set -euo pipefail
          dist plan --output-format=json > plan-dist-manifest.json
          echo "plan=$(jq -c . plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

  # Builds every target of dist-workspace.toml before a merge. The matrix is
  # the artifacts matrix of the plan, the same one the generated release.yml
  # builds from on the tag, so a target the code cannot build fails the
  # request instead of a release whose tag already exists.
  dist-build:
    name: dist build (${{ join(matrix.targets, ', ') }})
    needs: dist-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.dist-plan.outputs.plan).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust where the container has none
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      - name: dist runs at the configured pin
        shell: bash
        run: |
          set -euo pipefail
          pin="$(grep -m1 '^cargo-dist-version' dist-workspace.toml | cut -d'"' -f2)"
          dist --version | grep -Fq "$pin"
      - name: Install the system packages the target needs
        run: ${{ matrix.packages_install }}
      - name: Build the matrix target
        env:
          DIST_ARGS: ${{ matrix.dist_args }}
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          dist build $DIST_ARGS

  # The one required check the trunk protection names. A forge resolves a
  # job's `needs` inside one workflow file, so every job whose failure must
  # hold a merge is listed here and nowhere else.
  gate:
    name: gate
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs: [lint, test, build, supply-chain, flake, dist-plan, dist-build]
    steps:
      - name: Every needed job succeeded
        env:
          # A GitHub expression takes single-quoted string literals only; the
          # double-quoted separator made the whole workflow file unparsable.
          # The results reach the step through the environment, so no result
          # value is interpolated into the shell.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a needed job reported $result"; exit 1; }
          done
