[workspace]
members = [".", "xtask"]

[package]
name = "claude-session"
version = "0.1.0"
edition = "2024"
# The oldest compiler this crate supports, so cargo refuses an unsupported build
# with a clear message instead of failing deep inside a dependency. Distinct from
# the pin in rust-toolchain.toml: that is what we build with, this is what we
# support. Raising it is a breaking change for consumers.
# See docs/decisions/ADR-0019-pin-the-toolchain-and-declare-an-msrv.md.
rust-version = "1.97"
authors = ["Gustavo Basso <gu@gubasso.xyz>"]
description = "A CLI wrapper around the `claude` command that adds isolated, XDG-compliant sessions and multi-account switching."
license = "MIT OR Apache-2.0"
repository = "https://github.com/gubasso/claude-session"
readme = "README.md"
keywords = ["claude", "cli", "session", "wrapper", "anthropic"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
  "/AGENTS.md",
  "/CLAUDE.md",
  "/.claude",
  "/.config",
  "/.editorconfig",
  "/.envrc",
  "/.github",
  "/.pre-commit-config.yaml",
  "/committed.toml",
  "/deny.toml",
  "/docs",
  "/flake.lock",
  "/flake.nix",
  "/install-common.sh",
  "/install.sh",
  "/justfile",
  "/.markdownlint-cli2.jsonc",
  # The per-shape MD043 arrays are development tooling like the file above them;
  # a directory is not covered by the entry that excludes the root config.
  "/.markdownlint",
  "/dprint.json",
  "/dprint.markdown.json",
  "/statix.toml",
  "/dist-workspace.toml",
  "/release-plz.toml",
  "/scripts",
  # The suite reads docs/, which this list already excludes, so a packaged crate
  # would carry tests it cannot satisfy. Tests run from the git tree; cargo-dist
  # and release-plz build from the checkout, so the release path is unaffected.
  "/tests",
  "/uninstall.sh",
  # A second workspace member is development tooling, and a denylist entry
  # anchors one path, so the directory needs its own line beside the alias file.
  "/xtask",
  "/.cargo",
]

[lib]
name = "claude_session"
path = "src/lib.rs"

[[bin]]
name = "claude-session"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.2"
figment = { version = "0.10.19", features = ["env", "toml"] }
rustix = { version = "1.1.4", features = ["fs", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
thiserror = "2.0.19"
toml = "1.1.4"
tracing = "0.1.44"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
