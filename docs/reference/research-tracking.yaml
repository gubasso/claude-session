      - https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md
    revalidate: >-
      Check the current troubleshooting documentation and changelog for the
      minimum version attached to shared-login refresh coordination. Confirm
      the child still reports its version in a parseable form: the launch
      check fails closed when it does not, so a presentation change here
      blocks login mode.

  - id: child-cross-process-refresh-lock
    fact: >-
      Processes sharing one saved login coordinate refresh from child version
