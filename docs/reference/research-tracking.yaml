# Perishable artifact registry.
#
# Each entry tracks one owning artifact whose externally controlled inputs can
# drift. The owning document states the facts; this file records freshness and
# revalidation only. The former per-fact `id` keys were deliberately dropped.
# Distinct revalidation procedures from the 31 earlier records are preserved
# inside each artifact's `revalidate` field.

tracked:
  - path: .github/workflows/ci.yml
    last_checked: 2026-07-30
    cadence: quarterly
    why: Pinned action tags and the code they resolve to can move independently of this repository.
    revalidate: >-
      Compare every action tag in this workflow with the action's current
      release and security advisories. Record a changed or superseded pin; an
      unchanged `uses:` line is not evidence that its mutable tag is unchanged.
    dependents:
      - docs/reference/testing-and-quality.md

  - path: .github/workflows/release-plz.yml
    last_checked: 2026-07-30
    cadence: quarterly
    why: Publishing identities, action contracts, tag pins, and forge token behavior are externally controlled.
    revalidate: >-
      Compare every action tag with current releases and advisories. Re-check
      crates.io Trusted Publishing identity fields, supported triggers,
      enforcement, and first-publish requirements. Re-check release-plz
      commands, default-branch behavior, OIDC authentication, outputs, and tag
      shape. Re-check GitHub default-token retriggering, the installed-App token
      action's inputs and behavior, and personal-account ruleset bypass actors.
      Use the current public crates.io, release-plz, GitHub Actions, action, and
      ruleset documentation.
    dependents:
      - docs/guides/releasing.md
      - docs/reference/release-workflow.md
      - release-plz.toml

  - path: .github/workflows/release.yml
    last_checked: 2026-07-30
    cadence: quarterly
    why: Generated distribution workflow contracts and pinned action tags can drift upstream.
    revalidate: >-
      Compare every action tag with current releases and advisories. Re-check
      cargo-dist's stable version, configuration schema, generated workflow
      filename and trigger, supported targets and runners, and generated action
      versions against its public documentation.
    dependents:
      - dist-workspace.toml
      - docs/reference/release-workflow.md

  - path: docs/reference/accounts.md
    last_checked: 2026-08-11
    cadence: monthly
    why: Child authentication commands, precedence, refresh coordination, credential lifetimes, and TUI behavior are externally owned.
    revalidate: >-
      Read current public authentication, CLI, directory, troubleshooting, and
      changelog material. Run two concurrent children against one isolated
      configuration directory across refresh and confirm one coordinated
      renewal without recording credentials (slice 005; Q-002). Run
      `setup-token` with redacted output and confirm the token is accepted only
      through its documented environment variable. Test redacted combinations
      of saved login, injected OAuth token, API key, auth token, helper, and
      cloud selectors to confirm precedence. Run auth status JSON in login and
      token modes, recording only schema, outcome, and exit status. Run logout
      against scratch state and verify disappearance by metadata only. Observe
      redacted saved-login expiry and token-mode status. Measure credential
      lifetimes from non-secret timestamps. Re-read the credential-management
      and changelog material that established in-TUI login behaviour, since
      both facts the wrapper warns about are published rather than measured:
      that a relocated configuration directory owns the credential file, and
      that a successful in-session login clears an injected token within that
      process from 2.1.118. Never record a credential value or child-owned
      fingerprint.
    dependents:
      - docs/decisions/ADR-0025-share-one-native-login-per-account.md
      - docs/decisions/ADR-0026-store-and-inject-a-long-lived-subscription-token.md
      - docs/decisions/ADR-0027-ingest-secrets-only-from-stdin-or-a-terminal.md
      - docs/decisions/ADR-0031-enforce-the-child-refresh-lock-version-floor.md
      - docs/reference/exit-codes.md
      - docs/reference/logging-and-output.md
      - docs/reference/process-runtime.md
      - docs/reference/xdg-storage.md

  - path: docs/reference/cli-surface.md
    last_checked: 2026-08-06
    cadence: monthly and on every adopted child or parser major release
    why: Child spellings and parser treatment of unknown leading flags can change across releases.
    revalidate: >-
      Rebuild the child's top-level and per-subcommand inventory from its own
      help, and rewrite tests/fixtures/child-inventory.yaml from that
      measurement: run
      `claude --help` for the top-level flags and verbs, then `claude <verb>
      --help` for each verb, keeping every list byte-sorted and unique. Update
      child_version, measured_on, and the prose in ./cli-surface.md that names
      the same version and date, which the collision audit compares. The audit
      never runs the child, so this is the only step that measures it.
      Corroborate with the public CLI reference, record new overlaps, and drop
      or rename any wrapper spelling whose meaning would change. On a parser
      major upgrade, retry a leading unknown flag without the pre-split using
      the upstream external-subcommand cookbook; keep the golden argv tests
      regardless of outcome.
    dependents:
      - tests/fixtures/child-inventory.yaml
      - docs/decisions/ADR-0002-verbatim-argv-passthrough.md
      - docs/decisions/ADR-0003-reserve-a-small-wrapper-cli-surface.md
      - docs/decisions/ADR-0044-audit-wrapper-spellings-against-the-child-inventory.md
      - docs/decisions/ADR-0045-compose-doctor-with-the-child-report.md
      - docs/explanation/wrapper-model.md
      - docs/reference/testing-and-quality.md

  - path: docs/reference/configuration.md
    last_checked: 2026-08-04
    cadence: monthly
    why: The native settings schema, flag constraints, and scope precedence evolve outside this repository.
    revalidate: >-
      Read the current public settings and CLI references. The key names
      themselves are not tracked and never enter this repository (ADR-0088);
      what is tracked is the shape of the boundary around them. Launch with a
      temporary settings file and confirm the
      setting, regular-file rule, 2 MiB cap, and accepted command positions.
      Re-read managed, command-line, local-project, shared-project, and user
      precedence; verify array concatenation/de-duplication and the
      setting-sources selector. A changed size rule, managed precedence, or
      array direction changes the composition boundary.
    dependents:
      - docs/decisions/ADR-0010-compose-native-settings-from-declared-layers.md
      - docs/decisions/ADR-0028-pass-composed-settings-with-the-native-flag.md
      - docs/reference/process-runtime.md

  - path: docs/reference/dependencies.md
    last_checked: 2026-08-06
    cadence: semiannual
    why: Reviewed crates can become unmaintained, deprecated, or superseded.
    revalidate: >-
      Inspect every named crate individually for maintenance status and a
      successor. The page carries rulings rather than version numbers, so
      review every name and ruling; a spot check is not sufficient.
    dependents:
      - docs/plan/slices/012-human-presentation/README.md

  - path: docs/reference/presentation.md
    last_checked: 2026-08-06
    cadence: semiannual
    why: Published colour conventions and terminal guidance can change independently of this repository.
    revalidate: >-
      Re-read no-color.org, force-color.org, FreeBSD ls(1), and clig.dev.
      Reconfirm activation, precedence, TERM behavior, and target-stream
      detection before changing the ladder or its rejected inputs.
    dependents:
      - docs/decisions/ADR-0083-read-only-the-two-published-colour-variables.md
      - docs/reference/prior-art.md
      - docs/plan/slices/012-human-presentation/README.md

  - path: docs/reference/prior-art.md
    last_checked: 2026-08-04
    cadence: quarterly
    why: Comparable projects change quickly and the child may gain native multi-account support.
    revalidate: >-
      Re-survey the account-switcher and session-wrapper landscape from public
      project sources. Confirm each cited project still exists and is
      maintained, and inspect new projects for solutions to this project's open
      problems. Check upstream feature requests and the child changelog for a
      native account catalog and switching surface. If native switching ships,
      re-evaluate isolation; configuration directories alone do not qualify.
    dependents:
      - docs/explanation/session-isolation.md

  - path: docs/reference/process-runtime.md
    last_checked: 2026-07-30
    cadence: monthly and on slice 003 implementation
    why: Child directory, version, settings precedence, and proxy environment can drift.
    revalidate: >-
      Read current public child directory, authentication, debugging,
      troubleshooting, changelog, CLI, and environment documentation. Run the
      child with its configuration-directory variable pointed at empty scratch
      state and confirm configuration and login placement. Re-check the
      shared-login version floor and parseable version output (Q-002). Run the
      child doctor with two settings paths in both orders, one malformed, and
      confirm the last occurrence alone wins. The proxy seam is not tracked:
      the wrapper neither sets nor reads the child's base-URL variable, so this
      repository carries no name for it to drift (ADR-0089). Confirm the exec'd child still
      accepts the wrapper-built argument vector and environment unchanged.
    dependents:
      - docs/decisions/ADR-0006-place-files-by-xdg-ownership.md
      - docs/decisions/ADR-0025-share-one-native-login-per-account.md
      - docs/decisions/ADR-0028-pass-composed-settings-with-the-native-flag.md
      - docs/decisions/ADR-0031-enforce-the-child-refresh-lock-version-floor.md
      - docs/decisions/ADR-0047-let-a-user-settings-flag-override-the-group-layer.md
      - docs/decisions/ADR-0084-exec-the-child-instead-of-supervising-it.md
      - docs/explanation/session-isolation.md
      - docs/explanation/wrapper-model.md

  - path: docs/reference/release-workflow.md
    last_checked: 2026-07-30
    cadence: quarterly
    why: Trusted Publishing, release automation, distribution, and forge-token contracts are externally controlled.
    revalidate: >-
      Re-check the current public crates.io Trusted Publishing identity,
      triggers, enforcement, and first-publish rules; release-plz commands,
      default branch, OIDC, outputs, and tags; GitHub default-token retriggering,
      installed-App token inputs, and personal-account bypass actors; and
      cargo-dist's stable schema, workflow trigger, targets, runners, and
      generated actions. Reconcile any drift with the three workflow entries.
    dependents:
      - .github/workflows/release-plz.yml
      - .github/workflows/release.yml
      - docs/guides/releasing.md
      - release-plz.toml

  - path: docs/reference/xdg-storage.md
    last_checked: 2026-07-30
    cadence: monthly
    why: Child credential placement, XDG runtime guarantees, and dependency handling of invalid XDG values are external facts.
    revalidate: >-
      Read current public child authentication and environment documentation,
      then authenticate into an isolated configuration directory and confirm
      credential location by metadata only. Re-read the XDG base-directory
      specification for runtime guarantees and confirm explicit degradation in
      a container; treat absence claims for cron and remote login as unverified
      until measured. Re-check the directories crate's source and public docs
      to confirm empty or relative XDG values are discarded in favor of the
      specification default.
    dependents:
      - docs/decisions/ADR-0006-place-files-by-xdg-ownership.md
      - docs/decisions/ADR-0025-share-one-native-login-per-account.md
      - docs/explanation/session-isolation.md
      - docs/reference/accounts.md
      - docs/reference/dependencies.md
