  - id: child-settings-duplicate-flag
    fact: >-
      Given more than one settings flag the child keeps the last occurrence
      only; earlier files are not merged, not validated, and not read.
    owner: docs/reference/process-runtime.md
    dependents:
      - docs/decisions/ADR-0028-pass-composed-settings-with-the-native-flag.md
      - docs/decisions/ADR-0047-let-a-user-settings-flag-override-the-group-layer.md
      - docs/explanation/wrapper-model.md
    cadence: monthly
    last_checked: 2026-07-31
    source:
      - https://code.claude.com/docs/en/cli-reference
      - measured against claude 2.1.220 on linux, 2026-07-31
    revalidate: >-
      Run the current child's doctor with two settings paths where exactly one
      holds malformed JSON, in both orders; the invalid-settings section names
      the last path only. Order-independent reporting or an error means the
      precedence changed and ADR-0047 must be revisited.

  - id: child-credential-lifetimes
    fact: >-
