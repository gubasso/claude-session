# Perishable facts registry.
#
# The documents under docs/ rest on some facts this project does not control:
# the behaviour of the wrapped `claude` binary, the API surface of third-party
# crates, and the state of comparable open-source projects. Those facts expire.
#
# This file records each one, which document depends on it, how to re-check it,
# and when it was last verified. It is NOT a second home for the facts
# themselves — the owning document states the fact, and this file only tracks
# its freshness. If you find yourself explaining a rule here, it belongs in the
# owning document instead.
#
# Fields:
#   id          stable identifier, referenced from a review or an issue
#   fact        one line: what is being tracked, not the full statement
#   owner       the document that states the fact normatively
#   dependents  what breaks or needs revisiting if the fact changes
#   cadence     how often to re-check
#   last_checked  ISO date of the last verification
#   revalidate  concretely how to re-check it
#   source      optional; the upstream page(s) revalidation reads. A link here
#               is a starting point for the re-check, not a statement of the
#               fact — the owning document still states it.
#
# Stable rationale (an ADR's reasoning, a design principle) is NOT tracked here.
# It does not expire on a schedule; it is superseded by a decision.

version: 1

facts:
  - id: child-config-dir-var
    fact: >-
      CLAUDE_CONFIG_DIR selects one account-wide child configuration directory
      and relocates saved-login storage on Linux and Windows.
    owner: docs/reference/process-runtime.md
    dependents:
      - docs/explanation/session-isolation.md
      - docs/decisions/ADR-0006-place-files-by-xdg-ownership.md
      - docs/decisions/ADR-0025-share-one-native-login-per-account.md
      - docs/decisions/ADR-0028-pass-composed-settings-with-the-native-flag.md
    cadence: monthly
    last_checked: 2026-07-30
    source:
      - https://code.claude.com/docs/en/env-vars
    revalidate: >-
      Check the current environment-variable documentation, then run the child
      on Linux with the variable pointed at an empty account config directory
      and confirm configuration and login state are written there.

  - id: child-credential-file-layout
    fact: >-
      The child stores its saved login inside the configuration directory on
      Linux and Windows, while macOS uses Keychain.
    owner: docs/reference/xdg-storage.md
    dependents:
      - docs/reference/accounts.md
      - docs/decisions/ADR-0025-share-one-native-login-per-account.md
    cadence: monthly
    last_checked: 2026-07-30
    source:
      - https://code.claude.com/docs/en/authentication
    revalidate: >-
      Check current authentication and environment-variable documentation.
      Authenticate into an isolated config directory on Linux and Windows and
      confirm the file location; inspect documented macOS Keychain behavior.

  - id: child-settings-schema
    fact: >-
      The child's settings schema evolves independently, which is why
      composition validates structure but does not reject unknown keys.
    owner: docs/reference/configuration.md
    dependents:
      - docs/decisions/ADR-0010-compose-native-settings-from-declared-layers.md
    cadence: quarterly
    last_checked: 2026-07-28
    source:
      - https://code.claude.com/docs/en/settings
    revalidate: >-
      Compare the documented settings keys against the last recorded set. A
      maintained published schema would let validation tighten; check whether
      one now exists.

