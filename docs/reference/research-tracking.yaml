      settings document whose effect is visible without a network call against
      a malformed one, in both orders, and read what the child reports. The
      child's own health verb does not read a settings file and measures
      nothing here. The proxy seam is not tracked:
      the wrapper neither sets nor reads the child's base-URL variable, so this
      repository carries no name for it to drift (ADR-0089). Confirm the exec'd child still
      accepts the wrapper-built argument vector and environment unchanged.
    dependents:
