  - id: clap-external-subcommand-limits
    fact: >-
      External-subcommand handling captures an unexpected positional, not a
      leading unknown flag — which is why argv is pre-split before parsing.
    owner: docs/reference/cli-surface.md
    dependents:
      - docs/explanation/wrapper-model.md
      - docs/decisions/ADR-0002-verbatim-argv-passthrough.md
    cadence: on-major-upgrade
    last_checked: 2026-07-28
    revalidate: >-
      On a major parser upgrade, retry the leading-unknown-flag invocation
      without the pre-split. If the parser handles it, the pre-split may be
      simplifiable — but the golden-argv tests stay either way.

  - id: child-flag-and-verb-inventory
    fact: >-
      The child's top-level flag and subcommand spellings, and which of them
      the wrapper-owned table and verb table overlap.
    owner: docs/reference/cli-surface.md
    dependents:
      - docs/explanation/wrapper-model.md
      - docs/decisions/ADR-0003-reserve-a-small-wrapper-cli-surface.md
      - docs/decisions/ADR-0044-audit-wrapper-spellings-against-the-child-inventory.md
      - docs/decisions/ADR-0045-compose-doctor-with-the-child-report.md
      - docs/reference/testing-and-quality.md
    cadence: monthly, and on every child release the project adopts
    last_checked: 2026-07-31
    source:
      - https://code.claude.com/docs/en/cli-reference
      - the checked-in inventory fixture, labelled with the version it was taken from
      - measured against claude 2.1.220 on linux, 2026-07-31
    revalidate: >-
      Rebuild the inventory from the child's own help, top level and every
      subcommand, and diff it against the fixture. Upstream documentation is
      not exhaustive, so the fixture is the authority and the published page
      is the corroboration. Record a new shadowing overlap in the child-status
      column; an overlap that would change a token's meaning forces the
      wrapper spelling to be dropped or renamed under a new record.

  - id: signal-forwarding-model
    fact: >-
      In a shared foreground process group the terminal delivers signals to
      every member, so forwarding those signals double-delivers.
    owner: docs/reference/process-runtime.md
    dependents:
      - docs/explanation/wrapper-model.md
      - docs/decisions/ADR-0004-spawn-and-wait-child-supervision.md
    cadence: on-implementation
    last_checked: 2026-07-28
    revalidate: >-
      Verify empirically once the spawn path exists: send an interrupt to the
      group and confirm the child observes exactly one. This is design-derived
      until measured.

