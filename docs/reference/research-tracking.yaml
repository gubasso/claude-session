      - https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md
    revalidate: >-
      Check current troubleshooting documentation and changelog, then run two
      concurrent child processes against one config directory across a refresh
      boundary and confirm one coordinated renewal without login revocation.

