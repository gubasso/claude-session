  - path: docs/reference/release-workflow.md
    last_checked: 2026-07-30
    cadence: quarterly
    why: Trusted Publishing, release automation, distribution, and forge-token contracts are externally controlled.
    revalidate: >-
      Re-check the current public crates.io Trusted Publishing identity,
      triggers, enforcement, and first-publish rules; release-plz commands,
      default branch, OIDC, outputs, and tags; GitHub default-token retriggering,
      installed-App token inputs, and personal-account bypass actors; and
      cargo-dist's stable schema, workflow trigger, targets, runners, and
      generated actions. Reconcile any drift with the two workflow entries.
      `.github/workflows/release-plz.yml` carries no entry of its own, because
      release-kit owns that file: `rk status --check` reports drift against the
      version release-kit landed, and `rk versions --check` compares its action
      pins with their sources. An action pin that moved there is upgraded
      through `rk upgrade`, never by editing the file (ADR-0118).
    dependents:
      - .github/workflows/release-plz.yml
      - .github/workflows/release.yml
      - docs/guides/releasing.md
      - release-plz.toml

  - path: docs/reference/sessions.md
    last_checked: 2026-08-21
    cadence: monthly
    why: The name a session report carries comes from the child's own peer registration, an undocumented record whose fields, spelling, and location the child may change without a note anywhere a reader would look.
    revalidate: >-
      Launch the child through the wrapper and read the registration it writes
      under the shared peer registry. Confirm the record is still keyed by
      process identifier, still carries `name` and `procStart`, and that
      `procStart` still counts the same clock ticks the witness records, since
      that equality is what proves whose name a row carries. Confirm a rename
      inside the child still reaches the record. A changed record costs a row
      its name and never gives it a wrong one, so this entry reports a lost
      feature rather than a defect.
    dependents:
      - docs/decisions/ADR-0114-name-a-reported-session-as-the-child-does.md
      - src/domain/registration.rs
      - src/services/session/gc.rs

