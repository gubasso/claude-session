    fact: >-
      setup-token mints a long-lived subscription token consumed through
      CLAUDE_CODE_OAUTH_TOKEN and does not provide a wrapper-owned output format.
    owner: docs/reference/accounts.md
    dependents:
      - docs/decisions/ADR-0026-store-and-inject-a-long-lived-subscription-token.md
      - docs/decisions/ADR-0027-ingest-secrets-only-from-stdin-or-a-terminal.md
    cadence: quarterly
    last_checked: 2026-07-30
    source:
      - https://code.claude.com/docs/en/authentication
      - https://code.claude.com/docs/en/cli-reference
    revalidate: >-
      Check current authentication and CLI documentation, then run setup-token
      with redacted output and confirm the token works only through the
      documented environment variable. Do not codify presentation text.

  - id: child-auth-precedence
    fact: >-
      Ambient cloud, API, and helper authentication can shadow an injected
      subscription token, which in turn shadows a saved login.
    owner: docs/reference/accounts.md
    dependents:
      - docs/reference/process-runtime.md
      - docs/reference/logging-and-output.md
    cadence: monthly
    last_checked: 2026-07-30
    source:
      - https://code.claude.com/docs/en/authentication#authentication-precedence
    revalidate: >-
      Compare the current authentication-precedence documentation and test
      redacted combinations of saved login, OAuth-token injection, API key,
      auth token, helper, and each cloud-provider selector.

