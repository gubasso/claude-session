# Registry of child-owned names this repository carries.
#
# One entry per child-owned identifier that appears anywhere in the tree, with
# the wrapper obligation that requires it (ADR-0089). This file answers "why do
# we carry it at all"; ./research-tracking.yaml answers "has it drifted". The two
# lists are not the same set, and a fact needs an entry here before it can earn
# one there.
#
# `obligation` is one of:
#   launch          the wrapper sets it, or passes it in the argument vector
#   no-collision    the child's own spelling, which passthrough must not claim
#   scope-our-claim child behaviour carried so the wrapper does not over-claim
#   name-the-subject the child's name for a thing a wrapper report is about
#   describe-the-subject facts that distinguish a subject the report already names
#   contested       carried today, with an open question deciding whether it stays
#
# `contested` is temporary by construction: its `why` names the question, and the
# entry leaves when the question exits. It is not a fifth obligation.
#
# Every entry is enforced by ../../tests/repo_contracts/child_facts.rs, which
# fails on an occurrence at an unlisted site and on an entry that matches
# nothing. Registration is therefore mechanical and complete for these names.
# Child behaviour carried as prose — settings precedence, credential lifetimes —
# is governed by the same obligation test in ADR-0089 but is not machine
# checkable, and is enforced at review only.
#
# Discovery scans for `ANTHROPIC_`, `CLAUDE_CODE_`, and `CLAUDE_CONFIG_`. The
# wrapper's own `CLAUDE_SESSION_` prefix is not a child fact and is not scanned.
# Those prefixes describe environment variables. A child-owned name of any other
# shape — a key inside the child's own configuration file, for instance — is
# reached only by being listed in the test's own literal set, which is why adding
# one is two edits rather than one.
#
# Two shapes are therefore outside this file rather than missing from it. Child
# behaviour carried as prose is one. The other is a child-owned name that is an
# ordinary English word — the asset directories `skills`, `agents`, `rules`, and
# the rest of the set in ../../src/services/assets.rs. A literal entry for one of
# those matches this comment and every document that uses the word, so the scan
# cannot see them and an entry here would fail the dead-registry gate for having
# no scannable occurrence. Their obligation is recorded where they are declared,
# in that module and in ADR-0106, and enforced at review. Whether this file
# should govern a carried filename at all is Q-012 in ../plan/open-questions.md;
# until that is answered, silence here is a limit of the scan and not coverage.

carried:
  - fact: CLAUDE_CONFIG_DIR
    obligation: launch
    why: The wrapper sets it to point the child at the selected account's own state, which is what makes an account an account.
    sites:
      - docs/decisions/ADR-0025-share-one-native-login-per-account.md
      - docs/decisions/ADR-0026-store-and-inject-a-long-lived-subscription-token.md
      - docs/decisions/ADR-0028-pass-composed-settings-with-the-native-flag.md
      - docs/decisions/ADR-0064-key-composed-settings-by-profile-and-input-digest.md
      - docs/decisions/ADR-0089-carry-a-child-owned-fact-only-against-an-obligation.md
      - docs/decisions/ADR-0098-seed-the-one-child-key-a-launch-cannot-reach.md
      - docs/decisions/ADR-0102-key-child-state-by-terminal.md
      - docs/decisions/ADR-0103-permit-a-declared-link.md
      - docs/decisions/ADR-0104-share-one-credential-store.md
      - docs/explanation/session-isolation.md
      - docs/explanation/wrapper-model.md
      - docs/guides/supplying-child-plugins.md
      - docs/plan/slices/005-account-authentication/README.md
      - docs/reference/accounts.md
      - docs/reference/configuration.md
      # The switcher rows name the mechanism those projects select an account
      # with, which is the one this wrapper sets. The comparison does not exist
      # without it.
      - docs/reference/prior-art.md
      - docs/reference/process-runtime.md
      - src/commands/account.rs
      - src/domain/paths.rs
      - src/services/account.rs
      - src/services/child.rs
      - tests/accounts.rs
      - tests/passthrough.rs
      - tests/support/recording_child.rs

  - fact: CLAUDE_CODE_OAUTH_TOKEN
    obligation: launch
    why: The wrapper sets it in token mode, immediately before the exec, from the secret it stored. Every account-scoped subroutine drops an inherited one, so a credential from elsewhere cannot answer the question being asked about this account.
    sites:
      - docs/decisions/ADR-0026-store-and-inject-a-long-lived-subscription-token.md
      - docs/reference/accounts.md
      - docs/reference/process-runtime.md
      - src/services/account.rs
      - src/services/account/token.rs
      - src/services/child.rs
      - tests/accounts.rs
      - tests/support/recording_child.rs

  - fact: CLAUDE_CODE_OAUTH_REFRESH_TOKEN
    obligation: launch
    why: The wrapper sets it for the one child run that exchanges a supplied refresh token for a saved login, which is the child's own documented way to authenticate without a browser. Documented upstream, unlike the subscription type below.
    sites:
      - docs/reference/accounts.md
      - docs/reference/research-tracking.yaml
      - src/services/account/refresh.rs
      - tests/accounts.rs

  - fact: CLAUDE_CODE_OAUTH_SCOPES
    obligation: launch
    why: The wrapper sets it beside the refresh token, because the child requires the scopes the grant was issued with and refuses the exchange without them. Documented upstream; the set the wrapper defaults to is not, and is tracked in ./research-tracking.yaml.
    sites:
      - docs/reference/accounts.md
      - docs/reference/research-tracking.yaml
      - src/services/account/refresh.rs
      - tests/accounts.rs

  - fact: CLAUDE_CODE_SUBSCRIPTION_TYPE
    obligation: launch
    why: The wrapper sets it beside the injected token, because the child reads a plan only from the saved credential that token mode replaces. The four spellings the login prompt offers are values of this fact, read from child 2.1.220 and enforced at review rather than by this gate.
    sites:
      - docs/reference/accounts.md
      - docs/reference/process-runtime.md
      - docs/reference/research-tracking.yaml
      - src/services/child.rs
      - tests/accounts.rs

  - fact: CLAUDE_CODE_PLUGIN_CACHE_DIR
    obligation: contested
    why: Named in the plugin guide as the build-time variable that puts a seed at the path it will be read from, because a seed built elsewhere and moved loads none of its plugins. The wrapper neither sets nor reads it, so none of ADR-0089's obligations fits a carry that exists only to tell a person which command to run. Q-018 decides whether a guide-only carry belongs here at all.
    sites:
      - docs/guides/supplying-child-plugins.md
      - docs/plan/open-questions.md
      - docs/reference/research-tracking.yaml

  - fact: CLAUDE_CODE_PLUGIN_SEED_DIR
    obligation: launch
    why: The wrapper sets it to the read-only plugin tree the user maintains, because a session directory the launch just created registers no plugins of its own. An inherited one is dropped, so a session reaches the tree the wrapper selected rather than the one its environment was built for.
    sites:
      - docs/decisions/ADR-0117-supply-plugins-from-a-read-only-seed.md
      - docs/guides/supplying-child-plugins.md
      - docs/reference/process-runtime.md
      - docs/reference/research-tracking.yaml
      - src/services/child.rs
      - tests/passthrough.rs

  - fact: CLAUDE_SECURESTORAGE_CONFIG_DIR
    obligation: launch
    why: The wrapper sets it to the account directory holding the saved login, so the per-terminal configuration directories of one account share one credential rather than one each. Undocumented by the child, so its freshness is tracked in ./research-tracking.yaml.
    sites:
      - docs/decisions/ADR-0104-share-one-credential-store.md
      - docs/reference/accounts.md
      - docs/reference/process-runtime.md
      - src/services/child.rs
      - tests/accounts.rs
      - tests/passthrough.rs

  - fact: lspRecommendationDisabled
    obligation: launch
    why: The wrapper writes it into the session directory it created, while the user asks for it, because a directory that never existed asks the child's plugin recommendation again in every session and the answer they already gave went with the directory that held it.
    sites:
      - docs/reference/configuration.md
      - src/services/account/onboarding.rs
      - tests/accounts.rs

  - fact: procStart
    obligation: name-the-subject
    why: The wrapper reads the child's peer registration to name a session in its own report, because the reader knows a session by the name the child gives it and not by the directory the wrapper made (ADR-0114). This field is half the join that proves whose name it is, against the witness the launch wrote, so a reissued process identifier cannot lend a live agent's name to a dead session. The record's `name` key is carried against the same obligation and is an ordinary English word the discovery scan cannot see. Its working directory and status word describe the subject under ADR-0124; neither can be registered mechanically because one is ordinary language and the other occurs under unrelated obligations. Q-012 owns that limit.
    sites:
      - docs/plan/open-questions.md
      - docs/reference/research-tracking.yaml
      - docs/reference/sessions.md
      - src/domain/registration.rs
      - tests/sessions_gc.rs

  - fact: hasTrustDialogAccepted
    obligation: launch
    why: The wrapper writes it for the launch directory, because a per-terminal configuration directory resets the child's workspace-trust record and the same person already answered that prompt once. Written only while auto_trust_cwd is enabled.
    sites:
      - docs/reference/configuration.md
      - src/services/account/onboarding.rs
      - tests/accounts.rs

  - fact: hasCompletedProjectOnboarding
    obligation: launch
    why: Written beside the trust key, because the child asks two questions about a new workspace and answering one leaves the other prompt standing.
    sites:
      - docs/reference/configuration.md
      - src/services/account/onboarding.rs
      - tests/accounts.rs

  - fact: hasCompletedOnboarding
    obligation: launch
    why: The wrapper writes it when a launch creates this terminal's session directory, because it created the directory whose newness makes the child run its first-run setup instead of launching.
    sites:
      - docs/decisions/ADR-0098-seed-the-one-child-key-a-launch-cannot-reach.md
      - docs/decisions/ADR-0105-seed-a-session-at-launch.md
      - docs/reference/accounts.md
      - docs/reference/configuration.md
      - src/services/account/onboarding.rs
      - tests/accounts.rs
      - tests/support.rs

  - fact: ANTHROPIC_AUTH_TOKEN
    obligation: scope-our-claim
    why: Read but never set, so the wrapper can report that the account it selected was defeated. Membership is the whole carry; the order among these is the child's to arbitrate.
    sites:
      - docs/reference/accounts.md
      - src/domain/account.rs
      - tests/accounts.rs

  - fact: ANTHROPIC_API_KEY
    obligation: scope-our-claim
    why: Read but never set, so the wrapper can report that the account it selected was defeated. Membership is the whole carry; the order among these is the child's to arbitrate.
    sites:
      - docs/reference/accounts.md
      - src/domain/account.rs
      - src/domain/child.rs
      - tests/accounts.rs

  - fact: CLAUDE_CODE_USE_BEDROCK
    obligation: scope-our-claim
    why: Read but never set, so the wrapper can report that the account it selected was defeated. Membership is the whole carry; the order among these is the child's to arbitrate.
    sites:
      - src/domain/account.rs
      - tests/accounts.rs

  - fact: CLAUDE_CODE_USE_VERTEX
    obligation: scope-our-claim
    why: Read but never set, so the wrapper can report that the account it selected was defeated. Membership is the whole carry; the order among these is the child's to arbitrate.
    sites:
      - src/domain/account.rs
      - tests/accounts.rs

  - fact: CLAUDE_CODE_USE_FOUNDRY
    obligation: scope-our-claim
    why: Read but never set, so the wrapper can report that the account it selected was defeated. Membership is the whole carry; the order among these is the child's to arbitrate.
    sites:
      - src/domain/account.rs
      - tests/accounts.rs
